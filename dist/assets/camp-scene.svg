  <path d="M113 330c31-38 53-55 78-85 22-27 37-53 57-68 14 8 29 31 43 43 17-12 38-45 58-60 24 13 39 46 63 67 20-10 34-20 53-19 34 2 70 68 112 91l54 70-483 17Z" fill="#eef1ec"/>
