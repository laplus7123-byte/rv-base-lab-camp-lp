<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" fill="none" aria-labelledby="title desc" role="img">
  <title id="title">森のキャンプサイト</title>
  <desc id="desc">穏やかな山並み、松の木、緑のテントとランタンを配した、手描きの線によるキャンプ風景。</desc>
